version: '3.9'

services:
  # ─────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: monpsy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: monpsy_user
      POSTGRES_PASSWORD: monpsy_password
      POSTGRES_DB: monpsy_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    networks:
      - monpsy_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monpsy_user -d monpsy_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────
  # Redis Cache & Queue
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: monpsy_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - monpsy_network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  # MinIO Object Storage (S3-compatible)
  # ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: monpsy_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - monpsy_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────────────────
  # MinIO Client (bucket initialization)
  # ─────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: monpsy_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - monpsy_network
    entrypoint: >
      /bin/sh -c "
      mc alias set monpsy http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing monpsy/monpsy;
      mc anonymous set download monpsy/monpsy/public;
      exit 0;
      "

  # ─────────────────────────────────────────────────
  # NestJS Backend Application
  # ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    container_name: monpsy_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://monpsy_user:monpsy_password@postgres:5432/monpsy_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      BULL_REDIS_HOST: redis
      BULL_REDIS_PORT: 6379
      BULL_REDIS_PASSWORD: redis_password
    ports:
      - '3000:3000'
      - '9229:9229'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - monpsy_network
    command: npm run start:dev

  # ─────────────────────────────────────────────────
  # pgAdmin (Database GUI)
  # ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: monpsy_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@monpsy.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - '5050:80'
    networks:
      - monpsy_network
    depends_on:
      - postgres
    profiles:
      - tools

  # ─────────────────────────────────────────────────
  # Redis Insight (Redis GUI)
  # ─────────────────────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: monpsy_redis_insight
    restart: unless-stopped
    ports:
      - '8001:5540'
    networks:
      - monpsy_network
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  monpsy_network:
    driver: bridge
    name: monpsy_network
